  <style>
    * { box-sizing: border-box; }

    }

    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ============================================================
       STYLISH DESIGN SYSTEM TOKENS & SURFACES
       ============================================================ */

    /* Stylish Mesh Aurora Background */
    .stylish-bg {
      background-color: #fafbfc;
      background-image:
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 85% 10%, rgba(217, 70, 239, 0.10) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.08) 0px, transparent 60%),
        radial-gradient(at 80% 85%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
        radial-gradient(at 15% 85%, rgba(99, 102, 241, 0.10) 0px, transparent 50%);
    }

    .stylish-dots {
      background-image: radial-gradient(rgba(99, 102, 241, 0.14) 1.2px, transparent 1.2px);
      background-size: 28px 28px;
    }

    /* High-Fashion Gradient Typography */
    .text-stylish-gradient {
      background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 35%, #7c3aed 70%, #0284c7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .text-stylish-glow {
      background: linear-gradient(135deg, #4f46e5 0%, #a855f7 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Prismatic Border Cards */
    .stylish-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow:
        0 1px 3px 0 rgba(15, 23, 42, 0.03),
        0 12px 32px -4px rgba(99, 102, 241, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      border-radius: 1.5rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .stylish-card:hover {
      border-color: rgba(165, 180, 252, 0.8);
      box-shadow:
        0 20px 48px -8px rgba(99, 102, 241, 0.16),
        0 4px 12px -2px rgba(15, 23, 42, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      transform: translateY(-4px);
    }

    /* 3D Tilt Card */
    .card-3d-stylish {
      transform-style: preserve-3d;
      transform: perspective(1200px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform 0.12s ease, box-shadow 0.3s ease;
      will-change: transform;
    }

    /* Floating Holographic Badge Widget */
    .holo-widget {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow:
        0 12px 28px -4px rgba(99, 102, 241, 0.14),
        0 4px 10px rgba(15, 23, 42, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      pointer-events: none;
      position: absolute;
      z-index: 10;
    }

    /* Stylish Button with Dynamic Shimmer */
    .btn-stylish {
      position: relative;
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 60%, #6366f1 100%);
      color: #ffffff;
      font-weight: 700;
      border-radius: 1rem;
      box-shadow:
        0 10px 24px -4px rgba(79, 70, 229, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    .btn-stylish:hover {
      transform: translateY(-2px);
      box-shadow:
        0 16px 32px -6px rgba(79, 70, 229, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .btn-stylish:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.35);
    }

    /* Refined Badge Pills */

      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      border: 1px solid rgba(226, 232, 240, 0.9);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);

      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.12);

    }

  <script>
    (function () {
      var isCoarse = window.matchMedia('(pointer: coarse)').matches;
      if (isCoarse) return;
      var MAX_TILT = 8;
      function onMove(e) {
        var card = e.target.closest('.card-3d-stylish');
        if (!card) return;
        var r = card.getBoundingClientRect();
        var px = (e.clientX - r.left) / r.width;
        var py = (e.clientY - r.top) / r.height;
        card.style.setProperty('--rx', ((0.5 - py) * MAX_TILT * 2).toFixed(2) + 'deg');
        card.style.setProperty('--ry', ((px - 0.5) * MAX_TILT * 2).toFixed(2) + 'deg');
      }
      function onLeave(e) {
        var card = e.target.closest('.card-3d-stylish');
        if (!card) return;
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
      }
      document.addEventListener('pointermove', onMove, { passive: true });
      document.addEventListener('pointerout', onLeave, { passive: true });
    })();
  </script>
